services:
  bot_app:
    restart: unless-stopped
    mem_limit: 4g
    env_file:
      - .env
    environment:
      - RUNNING_IN_DOCKER=true
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3-embedding:0.6b}
      - VECTOR_MODE=${VECTOR_MODE:-local}

    # --- 部署方式二选一 ---
    # 方式一 (推荐): 从本地源代码构建
    # build:
    #   context: .
    #   dockerfile: .devcontainer/Dockerfile

    # 方式二: 使用自己构建并推送的镜像
    # image: your-registry/reply-core:latest

    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    container_name: ${INSTANCE_NAME:-reply-core}_bot
    volumes:
      - .:/app
      - ./data:/app/data
    command: python3 -u -m src.main
    networks:
      - bot_network
    depends_on:
      db:
        condition: service_healthy
      # ollama 只在本地向量模式下需要
      # 如果 VECTOR_MODE=none 或 VECTOR_MODE=api，可以手动注释掉 ollama 依赖
      ollama:
        condition: service_started
        required: false

  searxng:
    image: searxng/searxng:latest
    container_name: ${INSTANCE_NAME:-reply-core}_searxng
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - ./data/searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    networks:
      - bot_network

  db:
    # 使用官方打包好的 ParadeDB 镜像，它基于 PG16，内置 pgvector 与 BM25 所需的 pg_search
    image: paradedb/paradedb:latest-pg16
    container_name: ${INSTANCE_NAME:-reply-core}_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reply_core}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    #    ports:
    #      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    networks:
      - bot_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-reply_core}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  ollama:
    # Ollama 官方镜像，用于本地运行 embedding 模型
    # 仅在 VECTOR_MODE=local 时需要，使用 --profile ollama 启动
    image: ollama/ollama:latest
    container_name: ${INSTANCE_NAME:-reply-core}_ollama
    restart: unless-stopped
    expose:
      - "11434"
    volumes:
      - ./ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    networks:
      - bot_network
    # 启动后自动拉取配置的 embedding 模型
    entrypoint: >
      sh -c "
        ollama serve &
        sleep 5 &&
        echo '正在拉取 ${OLLAMA_MODEL:-qwen3-embedding:0.6b} 模型...' &&
        ollama pull ${OLLAMA_MODEL:-qwen3-embedding:0.6b} &&
        echo '模型拉取完成，Ollama 服务已就绪' &&
        tail -f /dev/null
      "
    profiles:
      - ollama

networks:
  bot_network:
    driver: bridge
